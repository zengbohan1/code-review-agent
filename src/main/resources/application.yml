spring:
  application:
    name: short-drama-agent

  # 加载项目 .env（已被 .gitignore 排除）作为属性源；缺失时静默跳过
  config:
    import: optional:file:.env[.properties]

  # 外部 PostgreSQL 需显式开启 SQL 初始化（schema.sql / data.sql 幂等）
  sql:
    init:
      mode: always

  # PostgreSQL：mock 订单数据 + pgvector 向量库；连接参数从 .env 读取（.env 不进 git）
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/shortdrama}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}

  # OpenAI 自动配置的其余组件（audio/image 等）需要 api-key 存在才初始化；
  # 实际 Chat 模型由 config/AiModelConfig 手动装配（key 直接读环境变量）
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:}

  # DeepSeek 接入参数（AiModelConfig 手动装配）：key/base-url/model 直接读环境变量
  llm:
    temperature: 0.7
    max-tokens: 1024
    # LLM 调用超时：连接 10s + 读响应 60s，超时触发重试与降级
    connect-timeout-ms: 10000
    read-timeout-s: 60

server:
  port: 8080

logging:
  level:
    com.shortdrama.agent: DEBUG
  file:
    name: logs/app.log
